<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Edison — Backend &amp; Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="60%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#0a2533"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="50%" stop-color="#7ee7c7"/>
      <stop offset="100%" stop-color="#41B883"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0%" stop-color="#00ADD8" stop-opacity=".45"/><stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0%" stop-color="#41B883" stop-opacity=".35"/><stop offset="100%" stop-color="#41B883" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace}
      .fade{opacity:0;animation:in .6s ease-out forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}
      .t1{animation-delay:1.2s}.t2{animation-delay:1.7s}.t3{animation-delay:2.2s}.t4{animation-delay:2.7s}.t5{animation-delay:3.2s}.t6{animation-delay:3.7s}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.fade{opacity:1;animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="180" cy="40" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="180;260;180" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="300" r="300" fill="url(#glowB)">
      <animate attributeName="cy" values="300;240;300" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- left: identity -->
    <g class="sans">
      <text x="72" y="92" class="fade d1" font-size="15" letter-spacing="4" fill="#58A6FF" font-weight="600">HELLO, WORLD</text>
      <text x="68" y="168" class="fade d2" font-size="80" font-weight="800" fill="url(#title)">Edison</text>
      <text x="72" y="210" class="fade d3" font-size="24" fill="#e6edf3" font-weight="500">Backend &amp; Full-Stack Engineer</text>
      <text x="72" y="242" class="fade d3" font-size="16" fill="#8b949e">High-concurrency services  ·  Real-time messaging  ·  Admin platforms</text>
    </g>

    <!-- right: terminal card -->
    <g transform="translate(700 58)">
      <rect width="430" height="186" rx="12" fill="#0d1117" fill-opacity=".82" stroke="#30363d"/>
      <rect width="430" height="32" rx="12" fill="#161b22"/>
      <rect y="20" width="430" height="12" fill="#161b22"/>
      <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
      <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
      <circle cx="60" cy="16" r="6" fill="#27c93f"/>
      <text x="215" y="21" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">~/fixalllow — zsh</text>
      <g class="mono" font-size="14">
        <text x="20" y="62"  class="fade t1"><tspan fill="#7ee787">➜</tspan><tspan fill="#58A6FF"> ~ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
        <text x="20" y="84"  class="fade t2" fill="#8b949e">edison · gopher &amp; vue builder</text>
        <text x="20" y="112" class="fade t3"><tspan fill="#7ee787">➜</tspan><tspan fill="#58A6FF"> ~ </tspan><tspan fill="#e6edf3">cat stack.txt</tspan></text>
        <text x="20" y="134" class="fade t4" fill="#00ADD8">Go · Gin · NATS · MongoDB · WebSocket</text>
        <text x="20" y="154" class="fade t5" fill="#41B883">Vue 3 · TypeScript · Vite · Flutter</text>
        <text x="20" y="176" class="fade t6"><tspan fill="#7ee787">➜</tspan><tspan fill="#58A6FF"> ~ </tspan><tspan class="cursor" fill="#e6edf3">▋</tspan></text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#30363d" stroke-opacity=".6"/>
</svg>
