<svg xmlns="http://www.w3.org/2000/svg" width="860" height="186" viewBox="0 0 860 186">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ADD8"/><stop offset="1" stop-color="#41B883"/>
  </linearGradient>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif} .mono{font-family:"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace}
    .label{font-size:11px;font-weight:600;letter-spacing:.14em;fill:#656d76}
    .muted{fill:#656d76} .fg{fill:#1f2328}
    .in{opacity:0;animation:in .5s ease-out forwards}
    @keyframes in{from{opacity:0}to{opacity:1}}
    
    @media (prefers-reduced-motion:reduce){.in,.draw{opacity:1;animation:none;stroke-dashoffset:0}}
  </style>
</defs>
<rect x=".5" y=".5" width="859" height="185" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect x="32" y="29" width="3" height="14" rx="1.5" fill="url(#accent)"/><text x="44" y="40" class="label">OVERVIEW</text><text x="828" y="40" text-anchor="end" font-size="12" class="muted">57 repositories · 20 stars</text>
<g class="in" style="animation-delay:0.10s">
  <rect x="32.0" y="62" width="188.5" height="96" rx="10" fill="#f6f8fa" stroke="#eaeef2"/>
  <text x="50.0" y="86" class="label" font-size="10">CONTRIBUTIONS</text>
  <text x="48.0" y="126" font-size="34" font-weight="700" fill="url(#accent)" letter-spacing="-.02em">824</text>
  <text x="50.0" y="146" font-size="12" class="muted">last 12 months</text>
</g>
<g class="in" style="animation-delay:0.22s">
  <rect x="234.5" y="62" width="188.5" height="96" rx="10" fill="#f6f8fa" stroke="#eaeef2"/>
  <text x="252.5" y="86" class="label" font-size="10">ALL-TIME</text>
  <text x="250.5" y="126" font-size="34" font-weight="700" fill="url(#accent)" letter-spacing="-.02em">1,228</text>
  <text x="252.5" y="146" font-size="12" class="muted">since 2018</text>
</g>
<g class="in" style="animation-delay:0.34s">
  <rect x="437.0" y="62" width="188.5" height="96" rx="10" fill="#f6f8fa" stroke="#eaeef2"/>
  <text x="455.0" y="86" class="label" font-size="10">CURRENT STREAK</text>
  <text x="453.0" y="126" font-size="34" font-weight="700" fill="url(#accent)" letter-spacing="-.02em">2</text>
  <text x="455.0" y="146" font-size="12" class="muted">days</text>
</g>
<g class="in" style="animation-delay:0.46s">
  <rect x="639.5" y="62" width="188.5" height="96" rx="10" fill="#f6f8fa" stroke="#eaeef2"/>
  <text x="657.5" y="86" class="label" font-size="10">LONGEST STREAK</text>
  <text x="655.5" y="126" font-size="34" font-weight="700" fill="url(#accent)" letter-spacing="-.02em">52</text>
  <text x="657.5" y="146" font-size="12" class="muted">Apr 26 – Jun 16, 2026</text>
</g>
</svg>
